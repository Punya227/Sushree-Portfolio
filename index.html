      const [trafficCounter, setTrafficCounter] = useState(148293);
      const [totalRevenue, setTotalRevenue] = useState(2572.45);
      const [successRate, setSuccessRate] = useState(99.4);
      const [interconnectedCarriers, setInterconnectedCarriers] = useState(110);

      useEffect(() => {
        const interval = setInterval(() => {
          const chunk = Math.floor(Math.random() * 8) + 2;
          setTrafficCounter(prev => prev + chunk);
          setTotalRevenue(prev => prev + chunk * selectedRoute.rate * (selectedRoute.margin / 100));
        }, 2500);
        return () => clearInterval(interval);
      }, [selectedRoute]);

      const handleRunTest = () => {
        if (testStatus === 'routing') return;
        setTestStatus('routing');
        setLogs([]);

        const steps = [
          `Initializing A2P Bind connection over SMPP v3.4 to ${selectedRoute.carrier}...`,
          `Testing path: ${selectedRoute.source} ➔ ${selectedRoute.destination}`,
          `Benchmarking wholesale rate at $${selectedRoute.rate.toFixed(4)} per message...`,
          `Analyzing route latency... current: ${selectedRoute.latency}ms`,
          `Applying automated route optimization logic...`,
        ];

        steps.forEach((step, index) => {
          setTimeout(() => {
            setLogs(prev => [...prev, step]);
          }, (index + 1) * 400);
        });

        setTimeout(() => {
          if (selectedRoute.status === 'congested') {
            setTestStatus('failed');
            setLogs(prev => [
              ...prev,
              `CRITICAL WARNING: Latency exceeds threshold. High delivery drop probability.`,
              `SMPP Error [0x0000000b] (Queue Congestion at ${selectedRoute.destination} gateway).`,
              `TEST COMPLETED: Route failed quality parameters.`
            ]);
            setSuccessRate(prev => Math.max(94.2, +(prev - 0.2).toFixed(1)));
          } else {
            setTestStatus('success');
            setLogs(prev => [
              ...prev,
              `DLR (Delivery Receipt) received from foreign network in ${selectedRoute.latency}ms.`,
              `SS7 Gateway handshake completed successfully.`,
              `SUCCESS: Route validated at ${selectedRoute.margin}% margin trading yield.`
            ]);
            setSuccessRate(prev => Math.min(99.9, +(prev + 0.1).toFixed(1)));
          }
        }, 2500);
      };

      const adjustRate = (delta) => {
        const newRoutes = routes.map((r) => {
          if (r.id === selectedRoute.id) {
            const newRate = Math.max(0.001, +(r.rate + delta).toFixed(4));
            const newMargin = Math.max(5, Math.min(45, Math.round(r.margin + (delta < 0 ? 1.5 : -1.5))));
            const updated = { ...r, rate: newRate, margin: newMargin };
            setSelectedRoute(updated);
            return updated;
          }
          return r;
        });
        setRoutes(newRoutes);
      };

      const triggerSwapAgreement = () => {
        setLogs(prev => [
          ...prev,
          `Initiating Bilateral Swap Negotiations for ${selectedRoute.destination} wholesale lines...`,
          `Exchanging traffic volume commitment: 10,000,000 monthly SMS.`,
          `Secured Swap Deal: Net rate restructured. Margin increased by +6%!`,
        ]);
        const newRoutes = routes.map((r) => {
          if (r.id === selectedRoute.id) {
            const updated = { ...r, margin: Math.min(40, r.margin + 6), status: 'active' };
            setSelectedRoute(updated);
            return updated;
          }
          return r;
        });
        setRoutes(newRoutes);
        setInterconnectedCarriers(prev => prev + 1);
      };

      return (
        <div className="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden relative">
          <div className="bg-stone-50 border-b border-stone-100 p-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 mb-2">
                <i data-lucide="globe" class="w-3 h-3 animate-spin-slow inline"></i> Interactive Telecom Lab
              </span>
              <h3 className="text-xl font-bold text-stone-900 tracking-tight">Wholesale Route Trading Engine</h3>
              <p className="text-sm text-stone-600 mt-1">Simulate actual day-to-day operations: optimize route margins, negotiate carrier pricing, and test carrier pipelines.</p>
            </div>
          </div>

          <div className="grid grid-cols-2 md:grid-cols-4 border-b border-stone-200 bg-stone-50/50">
            <div className="p-4 border-r border-stone-100">
              <p className="text-xs font-medium text-stone-500 uppercase tracking-wider">SMS Sim Volume</p>
              <p className="text-lg font-bold text-stone-800 mt-1">{trafficCounter.toLocaleString()}</p>
            </div>
            <div className="p-4 border-r border-stone-100">
              <p className="text-xs font-medium text-stone-500 uppercase tracking-wider">Bilateral Margin Yield</p>
              <p className="text-lg font-bold text-indigo-600 mt-1">${totalRevenue.toFixed(2)}</p>
            </div>
            <div className="p-4 border-r border-stone-100">
              <p className="text-xs font-medium text-stone-500 uppercase tracking-wider">Delivery SLA Rate</p>
              <p className="text-lg font-bold text-emerald-600 mt-1">{successRate}%</p>
            </div>
            <div className="p-4">
              <p className="text-xs font-medium text-stone-500 uppercase tracking-wider">Carrier Connections</p>
              <p className="text-lg font-bold text-stone-800 mt-1">{interconnectedCarriers}</p>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12">
            <div className="lg:col-span-7 p-6 border-r border-stone-200">
              <h4 className="text-sm font-semibold text-stone-800 mb-3 flex items-center gap-2">
                <i data-lucide="cpu" class="w-4 h-4 text-indigo-500"></i> Select Carrier Hub Route
              </h4>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                {routes.map((route) => (
                  <button key={route.id} onClick={() => { setSelectedRoute(route); setTestStatus('idle'); setLogs([]); }} className={`text-left p-4 rounded-lg border transition-all relative ${
                    selectedRoute.id === route.id ? 'border-indigo-600 bg-indigo-50/20 ring-1 ring-indigo-600' : 'border-stone-200 hover:border-stone-300 hover:bg-stone-50'
                  }`}>
                    <div className="flex justify-between items-start">
                      <span className="font-semibold text-stone-800 text-sm">{route.source} ➔ {route.destination}</span>
                      <span className={`inline-block w-2.5 h-2.5 rounded-full ${route.status === 'active' ? 'bg-emerald-500' : route.status === 'congested' ? 'bg-amber-500' : 'bg-blue-500'}`} />
                    </div>
                    <div className="mt-2 text-xs text-stone-500 space-y-1">
                      <p>Carrier: {route.carrier}</p>
                      <div className="flex justify-between font-mono">
                        <span>Cost: ${route.rate.toFixed(4)}</span>
                        <span className="text-indigo-600 font-bold">Margin: {route.margin}%</span>
                      </div>
                    </div>
                  </button>
                ))}
              </div>

              <div className="bg-stone-50 rounded-lg p-5 border border-stone-100 mb-6">
                <h5 className="text-xs font-semibold text-stone-700 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                  <i data-lucide="trending-up" class="w-3.5 h-3.5 text-indigo-500 inline"></i> Procurement & Margin Maximizer
                </h5>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <p className="text-xs text-stone-500 mb-1">Negotiate Supplier Rate</p>
                    <div className="flex items-center gap-2">
                      <button onClick={() => adjustRate(-0.0005)} className="px-2.5 py-1 text-xs border border-stone-300 rounded bg-white hover:bg-stone-100 font-semibold text-stone-700">- $0.0005</button>
                      <span className="font-mono text-sm font-bold text-stone-800">${selectedRoute.rate.toFixed(4)}</span>
                      <button onClick={() => adjustRate(0.0005)} className="px-2.5 py-1 text-xs border border-stone-300 rounded bg-white hover:bg-stone-100 font-semibold text-stone-700">+ $0.0005</button>
                    </div>
                  </div>
                  <div>
                    <p className="text-xs text-stone-500 mb-1">Unilateral vs Swap Restructuring</p>
                    <button onClick={triggerSwapAgreement} className="w-full flex items-center justify-center gap-2 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-semibold transition">

                    </button>
                  </div>
                </div>
                <p className="text-[11px] text-stone-500 mt-3 leading-relaxed">

                </p>
              </div>

              <div className="flex flex-wrap gap-3">
                <button onClick={handleRunTest} disabled={testStatus === 'routing'} className="flex-1 flex items-center justify-center gap-2 px-4 py-3 bg-stone-900 hover:bg-stone-800 disabled:bg-stone-300 text-white font-semibold rounded-lg text-sm transition">

                <button onClick={() => { setTestStatus('idle'); setLogs([]); }} className="px-4 py-3 border border-stone-300 rounded-lg hover:bg-stone-50 text-stone-600 transition" title="Clear Logs">
                  <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <div className="lg:col-span-5 p-6 bg-stone-900 text-stone-300 flex flex-col justify-between min-h-[350px]">
              <div>
                <div className="flex justify-between items-center pb-3 border-b border-stone-800 mb-4">
                  <span className="text-xs font-bold uppercase tracking-wider text-stone-500">SMPP Test Console</span>
                  <div className="flex gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full bg-red-500/80"></span>
                    <span className="w-2.5 h-2.5 rounded-full bg-yellow-500/80"></span>
                    <span className="w-2.5 h-2.5 rounded-full bg-green-500/80"></span>
                  </div>
                </div>
                <div className="font-mono text-xs space-y-2 select-text">
                  <p className="text-stone-500">// Terminal connection live</p>
                  <p className="text-stone-500">// Waiting for packet transmission...</p>
                  {logs.map((log, index) => {
                    let color = 'text-stone-300';
                    if (log.startsWith('SUCCESS') || log.startsWith('DLR')) color = 'text-emerald-400 font-bold';
                    if (log.startsWith('CRITICAL') || log.startsWith('SMPP Error')) color = 'text-amber-400';
                    if (log.startsWith('TEST COMPLETED')) color = 'text-red-400 font-bold';
                    return <p key={index} className={`${color}`}>❯ {log}</p>;

                  {testStatus === 'routing' && (
                    <div className="flex items-center gap-2 text-indigo-400 mt-2 font-semibold">
                      <span className="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-ping"></span>
                      <span>Routing packets globally...</span>

              </div>
              <div className="mt-6 pt-4 border-t border-stone-800 flex items-center justify-between text-xs text-stone-500">
                <span>Gateway: ss7.okroute.carrier</span>
                <span>Status: {testStatus.toUpperCase()}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

  <!-- High-Performance Background Canvas Simulation Script -->
  <script>
    (function() {
      const canvas = document.getElementById('bg-network-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;
      
      const nodes = [];
      const connections = [];
      const ripples = [];
      const nodeCount = Math.min(Math.floor((width * height) / 18000), 45);
      const majorLocations = ['Malta', 'Singapore', 'India', 'Lebanon', 'London', 'Dubai', 'New York'];
      const mouse = { x: 0, y: 0, active: false };

      // Initialize nodes
      for (let i = 0; i < nodeCount; i++) {
        nodes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          radius: Math.random() * 2 + 1.5,
          id: i,
          pulse: Math.random() * Math.PI,
          label: i < majorLocations.length ? majorLocations[i] : undefined
        });
      }

      // Build connections
      for (let i = 0; i < nodes.length; i++) {
        const targets = nodes
          .filter(n => n.id !== nodes[i].id)
          .map(n => ({ node: n, dist: Math.hypot(n.x - nodes[i].x, n.y - nodes[i].y) }))
          .sort((a, b) => a.dist - b.dist)
          .slice(0, Math.random() > 0.5 ? 2 : 1);

        targets.forEach(target => {
          const exists = connections.some(c => (c.from === nodes[i].id && c.to === target.node.id) || (c.from === target.node.id && c.to === nodes[i].id));
          if (!exists && target.dist < 280) {
            connections.push({
              from: nodes[i],
              to: target.node,
              active: Math.random() > 0.3,
              packetProgress: Math.random(),
              packetSpeed: 0.002 + Math.random() * 0.004
            });
          }
        });
      }

      // Resize
      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // Interactive Events
      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
      });
      window.addEventListener('mouseleave', () => mouse.active = false);

      window.addEventListener('click', (e) => {
        ripples.push({
          x: e.clientX,
          y: e.clientY,
          radius: 0,
          maxRadius: 180 + Math.random() * 80,
          opacity: 1,
          speed: 3.5
        });

        connections.forEach(c => {
          const d1 = Math.hypot(c.from.x - e.clientX, c.from.y - e.clientY);
          if (d1 < 200) {
            c.active = true;
            c.packetSpeed = 0.012 + Math.random() * 0.008;
          }
        });
      });

      // Animation Loop
      function draw() {
        ctx.clearRect(0, 0, width, height);

        // Gradient Background
        const grad = ctx.createRadialGradient(width/2, height/2, 10, width/2, height/2, Math.max(width, height));
        grad.addColorStop(0, '#fafaf9');
        grad.addColorStop(0.5, '#f5f5f4');
        grad.addColorStop(1, '#e7e5e4');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        // Ripples
        for (let i = ripples.length - 1; i >= 0; i--) {
          const r = ripples[i];
          r.radius += r.speed;
          r.opacity = 1 - r.radius / r.maxRadius;
          if (r.opacity <= 0) {
            ripples.splice(i, 1);
            continue;
          }
          ctx.beginPath();
          ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(99, 102, 241, ${r.opacity * 0.15})`;
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // Move Nodes
        nodes.forEach(n => {
          n.x += n.vx;
          n.y += n.vy;
          n.pulse += 0.02;

          if (n.x < 0 || n.x > width) n.vx *= -1;
          if (n.y < 0 || n.y > height) n.vy *= -1;

          if (mouse.active) {
            const md = Math.hypot(n.x - mouse.x, n.y - mouse.y);
            if (md < 120) {
              const force = (120 - md) / 120;
              const angle = Math.atan2(n.y - mouse.y, n.x - mouse.x);
              n.x += Math.cos(angle) * force * 1.5;
              n.y += Math.sin(angle) * force * 1.5;
            }
          }
        });

        // Draw Connections
        connections.forEach(c => {
          const dist = Math.hypot(c.from.x - c.to.x, c.from.y - c.to.y);
          if (dist > 350) return;
          const alpha = (1 - dist / 350) * 0.2;
          ctx.beginPath();
          ctx.moveTo(c.from.x, c.from.y);
          ctx.lineTo(c.to.x, c.to.y);
          ctx.strokeStyle = `rgba(120, 113, 108, ${alpha})`;
          ctx.lineWidth = 0.75;
          ctx.stroke();

          if (c.active) {
            c.packetProgress += c.packetSpeed;
            if (c.packetProgress > 1) {
              c.packetProgress = 0;
              c.packetSpeed = 0.002 + Math.random() * 0.004;
            }
            const px = c.from.x + (c.to.x - c.from.x) * c.packetProgress;
            const py = c.from.y + (c.to.y - c.from.y) * c.packetProgress;

            ctx.beginPath();
            ctx.arc(px, py, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#6366f1';
            ctx.fill();
          }
        });

        // Draw Nodes
        nodes.forEach(n => {
          const pulse = 1 + Math.sin(n.pulse) * 0.25;
          const rad = n.radius * pulse;

          if (n.label) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, rad * 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(99, 102, 241, 0.05)';
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(n.x, n.y, rad, 0, Math.PI * 2);
          ctx.fillStyle = n.label ? '#4f46e5' : '#78716c';
          ctx.fill();

          if (n.label) {
            ctx.font = '10px monospace';
            ctx.fillStyle = '#44403c';
            ctx.textAlign = 'center';
            ctx.fillText(n.label, n.x, n.y - 12);
          }
        });

        requestAnimationFrame(draw);
      }

      draw();
    })();
  </script>
</body>
</html>

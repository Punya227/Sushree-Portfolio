<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sushree Sangita Panda | Senior Account Manager Portfolio</title>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icon Library -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif {
      font-family: 'Playfair Display', serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spinSlow 12s linear infinite;
    }

    @media print {
      body * {
        visibility: hidden !important;
      }
      #printable-cv-document, #printable-cv-document * {
        visibility: visible !important;
      }
      #printable-cv-document {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
    }
  </style>
</head>
<body class="bg-[#fafaf9] text-stone-800 antialiased selection:bg-indigo-600 selection:text-white pb-16 print:pb-0 print:bg-white">

  <!-- Interactive Network Canvas -->
  <canvas id="bg-network-canvas" class="fixed inset-0 pointer-events-auto z-0 select-none block"></canvas>

  <!-- React Mounting Root -->
  <div id="portfolio-app" class="relative z-10"></div>

  <!-- React Code Component -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const PERSONAL_DETAILS = {
      name: "SUSHREE SANGITA PANDA",
      title: "Senior Account Manager | International SMS & Carrier Relations",
      phone: "+91 6371069149",
      email: "sushreesangitapanda1999@gmail.com",
      linkedin: "linkedin.com/in/sushreesangita-panda-5b4084255",
      location: "India",
      summary: "Results-driven Telecommunications Senior Account Manager with 3+ years of progressive experience optimizing margin and revenue across international wholesale SMS and A2P messaging. Proven track record negotiating carrier and vendor rates, managing bilateral, unilateral, and swap trade agreements, and driving new business development to consistently meet and exceed sales targets."
    };

    const EXPERIENCE_HISTORY = [
      {
        role: "Senior Account Manager",
        company: "Ok Route Telecom Ltd",
        location: "Marsa, Malta",
        period: "Aug 2024 – Present",
        description: "Telecom Routing & Procurement Specialists",
        bulletPoints: [
          "Manage and grow a portfolio of client and supplier accounts, driving international SMS wholesale route trading through buying, selling, and swap arrangements.",
          "Own end-to-end routing and procurement strategy for assigned accounts, benchmarking carrier rates to protect and improve margin performance.",
          "Spearhead new business development, negotiating and closing trade agreements with carriers and enterprise clients to expand global route coverage.",
          "Represented the company at ITW (International Telecoms Week) Singapore, Dec 2025, strengthening carrier relationships and the global partner network."
        ]
      },
      {
        role: "Account Manager",
        company: "International Carrier Services",
        location: "Beirut, Lebanon",
        period: "May 2024 – Aug 2024",
        description: "International SMS Telecom Provider",
        bulletPoints: [
          "Optimized margin and revenue for the SMS business through continuous traffic analysis, consistently achieving sales targets.",
          "Negotiated costs and rates with telecom carriers, keeping client and vendor pricing current and competitive.",
          "Conducted regular rate updates and route testing using industry-standard testing tools as part of daily operations."
        ]
      },
      {
        role: "Carrier Relationship Executive",
        company: "SMS Cloud Hub",
        location: "Ahmedabad, India",
        period: "Mar 2023 – Apr 2024",
        description: "Cloud-Based SMS Solutions Provider",
        bulletPoints: [
          "Drove margin and revenue growth by monitoring SMS traffic flows and closing quarterly sales targets.",
          "Negotiated costs and pricing with telecom carriers for SMS traffic, coordinating rate updates with clients and vendors."
        ]
      }
    ];

    const COMPETENCIES = [
      { name: "Carrier & Vendor Negotiations", category: "core", description: "Negotiating rates, volumes, and terms with global telecom operators.", rating: 95 },
      { name: "Wholesale SMS/A2P Route Trading", category: "core", description: "Buying, selling, and swapping global routes to maximize SMS delivery and margin.", rating: 98 },
      { name: "Account & Client Relationship", category: "business", description: "Nurturing corporate partnerships and expanding high-value accounts globally.", rating: 92 },
      { name: "Margin & Revenue Optimization", category: "core", description: "Analyzing trade spreads, pricing structures, and routing costs to boost profits.", rating: 96 }
    ];

    const SEED_ROUTES = [
      { id: "route-1", source: "India", destination: "Malta", carrier: "Ok Route Premium", rate: 0.012, margin: 18, latency: 120, status: "active" },
      { id: "route-2", source: "Malta", destination: "Singapore", carrier: "ICS Global Transit", rate: 0.008, margin: 22, latency: 180, status: "active" },
      { id: "route-3", source: "Singapore", destination: "Lebanon", carrier: "ICS Direct Routing", rate: 0.019, margin: 15, latency: 240, status: "testing" }
    ];

    function PortfolioApp() {
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 45);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const scrollTo = (id) => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <header className={`fixed top-0 inset-x-0 z-50 transition-all ${scrolled ? 'bg-white/90 backdrop-blur-md shadow-sm border-b py-3' : 'bg-transparent py-5'}`}>
            <div className="max-w-7xl mx-auto px-4 flex justify-between items-center">
              <div className="flex items-center gap-2 font-bold uppercase text-stone-900">
                <span className="w-8 h-8 rounded bg-stone-900 text-white flex items-center justify-center text-sm">S</span>
                <span>Sushree <span className="text-indigo-600 font-normal">Panda</span></span>
              </div>
              <nav className="flex gap-4 text-xs font-semibold text-stone-600">
                <button onClick={() => scrollTo('hero')}>Overview</button>
                <button onClick={() => scrollTo('simulator')}>SMS Lab</button>
                <button onClick={() => scrollTo('experience')}>Experience</button>
                <button onClick={() => scrollTo('cv')} className="bg-indigo-600 text-white px-3 py-1.5 rounded">PDF CV</button>
              </nav>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 pt-28 space-y-20">
            <section id="hero" className="py-12">
              <h1 className="text-4xl md:text-6xl font-extrabold text-stone-900">{PERSONAL_DETAILS.name}</h1>
              <p className="text-lg font-bold text-indigo-600 mt-2">{PERSONAL_DETAILS.title}</p>
              <p className="text-stone-600 mt-4 max-w-2xl">{PERSONAL_DETAILS.summary}</p>
            </section>

            <section id="simulator" className="bg-white p-6 rounded-xl border border-stone-200 shadow-sm">
              <h2 className="text-2xl font-bold text-stone-900">Interactive Carrier Trading Engine</h2>
              <p className="text-sm text-stone-500 mb-6">Select routes and test SMPP deliverability live.</p>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {SEED_ROUTES.map(r => (
                  <div key={r.id} className="p-4 rounded-lg border border-stone-200 bg-stone-50">
                    <p className="font-bold text-stone-800">{r.source} ➔ {r.destination}</p>
                    <p className="text-xs text-stone-500 mt-1">Carrier: {r.carrier}</p>
                    <p className="text-xs font-mono text-indigo-600 mt-2 font-bold">Rate: ${r.rate} | Margin: {r.margin}%</p>
                  </div>
                ))}
              </div>
            </section>

            <section id="experience" className="space-y-6">
              <h2 className="text-2xl font-bold text-stone-900">Professional History</h2>
              <div className="space-y-4">
                {EXPERIENCE_HISTORY.map((e, idx) => (
                  <div key={idx} className="bg-white p-6 rounded-xl border border-stone-200">
                    <div className="flex justify-between items-start">
                      <div>
                        <h3 className="font-bold text-lg text-stone-900">{e.role}</h3>
                        <p className="text-sm text-indigo-600 font-semibold">{e.company} - {e.location}</p>
                      </div>
                      <span className="text-xs text-stone-500 bg-stone-100 px-2 py-1 rounded">{e.period}</span>
                    </div>
                    <ul className="list-disc pl-5 text-sm text-stone-600 mt-4 space-y-1">
                      {e.bulletPoints.map((bp, bIdx) => <li key={bIdx}>{bp}</li>)}
                    </ul>
                  </div>
                ))}
              </div>
            </section>

            <section id="cv" className="bg-white p-8 rounded-xl border border-stone-200 shadow-md">
              <div className="flex justify-between items-center pb-4 border-b">
                <h2 className="text-xl font-bold text-stone-900">Official Curriculum Vitae</h2>
                <button onClick={() => window.print()} className="bg-stone-900 text-white px-4 py-2 rounded text-xs font-semibold">Print / PDF</button>
              </div>
              <div className="mt-6 text-sm text-stone-800 space-y-4">
                <p><strong>Email:</strong> {PERSONAL_DETAILS.email} | <strong>Phone:</strong> {PERSONAL_DETAILS.phone}</p>
                <p>{PERSONAL_DETAILS.summary}</p>
              </div>
            </section>
          </main>

          <footer className="text-center py-8 text-xs text-stone-400 mt-20 border-t">
            &copy; {new Date().getFullYear()} Sushree Sangita Panda
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('portfolio-app')).render(<PortfolioApp />);
  </script>

  <!-- Interactive Canvas Animation -->
  <script>
    (function() {
      const canvas = document.getElementById('bg-network-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      const nodes = Array.from({ length: 30 }, (_, i) => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.4,
        vy: (Math.random() - 0.5) * 0.4
      }));

      function animate() {
        ctx.clearRect(0, 0, w, h);
        nodes.forEach(n => {
          n.x += n.vx;
          n.y += n.vy;
          if (n.x < 0 || n.x > w) n.vx *= -1;
          if (n.y < 0 || n.y > h) n.vy *= -1;
          ctx.beginPath();
          ctx.arc(n.x, n.y, 2, 0, Math.PI * 2);
          ctx.fillStyle = '#6366f1';
          ctx.fill();
        });
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
